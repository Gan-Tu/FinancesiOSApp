name: iOS Build and Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Build and test on iPhone
        run: scripts/test.sh
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Test-Results
          path: build/*.xcresult
          if-no-files-found: ignore
