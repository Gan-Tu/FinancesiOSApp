name: Prepare or Upload TestFlight Build
# Deliberately manual until the owner enables automatic TestFlight releases.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    environment: app-store
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Run app and UI tests
        run: scripts/test.sh
      - name: Archive and export with Apple cloud-managed signing
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_API_KEY:?Missing App Store Connect API key}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing API key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing API issuer ID}"
          SIGNING_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$SIGNING_KEY_PATH"
          AUTH_ARGS=(-allowProvisioningUpdates -authenticationKeyPath "$SIGNING_KEY_PATH" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          scripts/archive.sh "${AUTH_ARGS[@]}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          scripts/export_app_store.sh "${AUTH_ARGS[@]}"
      - name: Upload to App Store Connect
        if: inputs.upload
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file build/export/FinancesiOS.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Preserve signed build
        uses: actions/upload-artifact@v4
        with:
          name: Finances-iOS
          path: build/export/*.ipa
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
